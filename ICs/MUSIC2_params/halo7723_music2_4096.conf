# ================================================================
# CosmicGrain Halo 7723 MUSIC2 zoom configuration
#
# Parent: 50 Mpc/h, zstart=99, level-9 (512^3) DM-only realization.
#
# Zoom hierarchy:
#   levelmin    = 7
#   levelmin_TF = 9
#   levelmax    = 12   -> 4096^3-equivalent finest resolution
#
# Phase consistency:
#   seed[9] is preserved from the parent realization.
#   Higher-level seeds add only new small-scale refinement modes.
#   No seed[7] or seed[8] is introduced.
#
# Halo 7723 Lagrangian region:
#   z~99 center = (35.07, 28.31, 14.24) Mpc/h
#   raw extent  = (1.82, 7.21, 1.35) Mpc/h
#   ref_center  = (0.70140000, 0.56620000, 0.28480000)
#   ref_extent  = (0.04186000, 0.16583000, 0.03105000)
#
# ref_extent includes ~15% padding beyond the traced 3 R200c region.
# ================================================================

[setup]

boxlength         = 50
zstart            = 99

levelmin          = 7
levelmax          = 12
levelmin_TF       = 9

ref_center        = 0.70140000, 0.56620000, 0.28480000
ref_extent        = 0.04186000, 0.16583000, 0.03105000

padding           = 8
align_top         = no

baryons           = yes
use_2LPT          = yes


[cosmology]

Omega_m           = 0.3158
Omega_L           = 0.6842
Omega_b           = 0.04936

H0                = 67.32
sigma_8           = 0.811
nspec             = 0.965

transfer          = camb_file
transfer_file     = ../camb_transfer_50Mpc_zoom_z99.dat


[random]

seed[9]           = 42424242
seed[10]          = 77231010
seed[11]          = 77231111
seed[12]          = 77231212


[output]

format            = arepo
filename          = IC_halo7723_zoom_4096.hdf5

gadget_lunit      = Mpc
gadget_vunit      = km/s
gadget_munit      = 1e10Msol

gadget_coarsetype = 1
gadget_num_files  = 1


[poisson]

fft_fine          = yes
accuracy          = 1e-4
grad_order        = 6
laplace_order     = 6


# ================================================================
# POST-GENERATION COSMICGRAIN PREPARATION
# ================================================================
#
# CosmicGrain uses NTYPES=7 with PartType6 reserved for dust.
#
# After MUSIC2 generation:
#   1. Validate the raw IC.
#   2. Run add_dust_type.py in place to extend the HDF5 particle-type
#      arrays to seven entries and create an empty PartType6 group.
#   3. Keep the canonical filename:
#        IC_halo7723_zoom_4096.hdf5
#   4. Confirm NumPart_Total[6] = 0 and MassTable[6] = 0.
#
# MUSIC2 already writes high-resolution gas, so Gadget-4 must NOT
# regenerate or split gas particles from the IC.
# ================================================================
