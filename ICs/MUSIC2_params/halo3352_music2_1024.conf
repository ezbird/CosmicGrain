# ================================================================
# CosmicGrain Halo 3352 MUSIC2 zoom configuration
#
# Parent: 50 Mpc/h, zstart=99, level-9 (512^3) DM-only realization.
#
# Zoom hierarchy:
#   levelmin    = 7
#   levelmin_TF = 9
#   levelmax    = 10   -> 1024^3-equivalent finest resolution
#
# Phase consistency:
#   seed[9] is preserved from the parent realization.
#   Higher-level seeds add only new small-scale refinement modes.
#   No seed[7] or seed[8] is introduced.
#
# Halo 3352 Lagrangian region:
#   z~99 center = (12.75, 18.31, 24.55) Mpc/h
#   raw extent  = (2.21, 8.07, 3.08) Mpc/h
#   ref_center  = (0.25500000, 0.36620000, 0.49100000)
#   ref_extent  = (0.05083000, 0.18561000, 0.07084000)
#
# ref_extent includes ~15% padding beyond the traced 3 R200c region.
# ================================================================

[setup]

boxlength         = 50
zstart            = 99

levelmin          = 7
levelmax          = 10
levelmin_TF       = 9

ref_center        = 0.25500000, 0.36620000, 0.49100000
ref_extent        = 0.05083000, 0.18561000, 0.07084000

padding           = 8
align_top         = no

baryons           = yes
use_2LPT          = yes


[cosmology]

Omega_m           = 0.3158
Omega_L           = 0.6842
Omega_b           = 0.04936

H0                = 67.32
sigma_8           = 0.811
nspec             = 0.965

transfer          = camb_file
transfer_file     = ../camb_transfer_50Mpc_zoom_z99.dat


[random]

seed[9]           = 42424242
seed[10]          = 33521010


[output]

format            = arepo
filename          = IC_halo3352_zoom_1024.hdf5

gadget_lunit      = Mpc
gadget_vunit      = km/s
gadget_munit      = 1e10Msol

gadget_coarsetype = 1
gadget_num_files  = 1


[poisson]

fft_fine          = yes
accuracy          = 1e-4
grad_order        = 6
laplace_order     = 6


# ================================================================
# POST-GENERATION COSMICGRAIN PREPARATION
# ================================================================
#
# CosmicGrain uses NTYPES=7 with PartType6 reserved for dust.
#
# After MUSIC2 generation:
#   1. Validate the raw IC.
#   2. Run add_dust_type.py in place to extend the HDF5 particle-type
#      arrays to seven entries and create an empty PartType6 group.
#   3. Keep the canonical filename:
#        IC_halo3352_zoom_1024.hdf5
#   4. Confirm NumPart_Total[6] = 0 and MassTable[6] = 0.
#
# MUSIC2 already writes high-resolution gas, so Gadget-4 must NOT
# regenerate or split gas particles from the IC.
# ================================================================
